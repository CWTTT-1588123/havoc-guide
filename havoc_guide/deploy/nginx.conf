# 海克斯大乱斗攻略站 —— Nginx 反代（阿里云免费证书版）
# 用法：把 YOUR_DOMAIN 换成你的域名，放到 /etc/nginx/sites-available/ 后
#       ln -s 到 sites-enabled/，nginx -t 测试，nginx -s reload
# 证书放在 /etc/nginx/ssl/ 下（阿里云 SSL 证书下载的 Nginx 格式）

server {
    listen 80;
    server_name YOUR_DOMAIN www.YOUR_DOMAIN;

    # 自动跳转 HTTPS
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    http2 on;
    server_name YOUR_DOMAIN www.YOUR_DOMAIN;

    # 阿里云免费证书：从控制台下载的 Nginx 格式，替换为你的文件名
    ssl_certificate     /etc/nginx/ssl/YOUR_DOMAIN.pem;
    ssl_certificate_key /etc/nginx/ssl/YOUR_DOMAIN.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    client_max_body_size 20m;   # 允许上传头像/背景图

    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
