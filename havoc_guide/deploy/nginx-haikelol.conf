# 海克斯大乱斗攻略站 —— Nginx 反代（阿里云免费证书版）域名：haikelol.com
# 用法：放到 /etc/nginx/sites-available/haikelol，然后
#       sudo ln -s /etc/nginx/sites-available/haikelol /etc/nginx/sites-enabled/haikelol
#       sudo nginx -t && sudo nginx -s reload
# 证书放到 /etc/nginx/ssl/ 下（阿里云 SSL 证书下载的 Nginx 格式，改名成 haikelol.com.pem/.key）

server {
    listen 80;
    server_name haikelol.com www.haikelol.com;

    # 自动跳转 HTTPS
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name haikelol.com www.haikelol.com;

    # 阿里云免费证书
    ssl_certificate     /etc/nginx/ssl/haikelol.com.pem;
    ssl_certificate_key /etc/nginx/ssl/haikelol.com.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    client_max_body_size 20m;   # 允许上传头像/背景图

    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
