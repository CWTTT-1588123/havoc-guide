  thead th { position:sticky; top:var(--headerh,95px); z-index:3; }
  thead th:first-child { border-top-left-radius:14px; }
  thead th:last-child { border-top-right-radius:14px; }
  tbody tr:last-child td:first-child { border-bottom-left-radius:14px; }
  tbody tr:last-child td:last-child { border-bottom-right-radius:14px; }
  /* 主页英雄排行：整体稍紧凑 + 两侧收窄（透明度与分类查看页一致） */
  #tbl { max-width:1140px; margin:0 auto; background:var(--panel); }
  #homeBar { max-width:1140px; margin:0 auto; }
  #tbl th, #tbl td { padding:11px 16px; font-size:24px; border-left:1px solid var(--line); }

  /* 分页 */
  .pager { display:flex; align-items:center; justify-content:center; gap:18px; margin-top:18px; }
  .pgbtn { width:54px; height:54px; border-radius:12px; background:var(--panel2); border:1px solid var(--line); color:#111; font-size:30px; line-height:1; cursor:pointer; transition:.15s; }
  .pgbtn:hover:not(:disabled) { border-color:#111; background:rgba(0,0,0,.06); }
  .pgbtn:disabled { opacity:.35; cursor:default; }
  .pginfo { font-size:25px; color:#111; font-weight:600; }  /* 英雄表头 + 分类弹层（悬停展开，2-2-1 排列；锚点在小区域上，避免位移） */
  .catth { z-index:9; } /* 该列保持吸顶；z-index 抬高使弹层整个上下文位于页面最顶层 */
  .catdrop { position:relative; display:inline-flex; align-items:center; gap:10px; cursor:default; }
  .catlabel { font-size:28px; color:var(--txt); }
  .catbtn { display:inline-flex; align-items:center; gap:5px; padding:6px 15px; border-radius:10px; background:rgba(74,168,255,.10); border:1px solid rgba(74,168,255,.36); color:var(--blue); font-size:22px; font-weight:600; cursor:pointer; transition:.15s; }
  .cb-ico { display:block; }
  .catv { font-size:22px; line-height:1; }
  .catbtn:hover, .catdrop:hover .catbtn { background:rgba(74,168,255,.20); border-color:var(--blue); }
  .catpop { display:none; position:absolute; top:calc(100% + 6px); left:-20px; z-index:9999; grid-template-columns:1fr; gap:8px; padding:12px; background:var(--panel2); border:1px solid var(--line); border-radius:14px; box-shadow:0 10px 28px rgba(60,90,150,.18); width:300px; }
  /* 透明桥接条：填补触发区与弹层之间的空隙，鼠标横跨时悬停不断档 */
  .catpop::before { content:''; position:absolute; top:-8px; left:0; right:0; height:8px; }
  .catdrop:hover .catpop { display:grid; }
  .catcard { display:flex; align-items:center; gap:10px; padding:10px 14px; border-radius:10px; background:#fff; border:1px solid var(--line); border-left:4px solid var(--c); cursor:pointer; transition:.15s; }
  .catcard:hover { background:#f0f3fa; }
  .ccdot { width:13px; height:13px; border-radius:50%; background:var(--c); flex:none; box-shadow:0 0 0 3px color-mix(in srgb, var(--c) 18%, transparent); }
  .ccname { font-size:23px; font-weight:600; }
  .ccnum { margin-left:auto; color:var(--sub); font-size:20px; }
  /* 分类排名页（与主页表格区分：横幅 + 卡片网格） */
  .cathead { display:flex; align-items:center; gap:20px; padding:22px 26px; border-radius:18px; color:#fff; background:linear-gradient(135deg, var(--c), #6a5bff); box-shadow:0 8px 24px rgba(60,90,150,.18); }
  .catttl { margin:0; font-size:36px; }
  .capsub { font-size:22px; opacity:.92; margin-top:4px; }
  .catgrid { display:grid; grid-template-columns:repeat(auto-fill, minmax(250px,1fr)); gap:16px; margin-top:18px; }
  .catcard2 { position:relative; background:var(--panel); border:1px solid var(--line); border-top:4px solid var(--c); border-radius:14px; padding:16px; cursor:pointer; transition:.15s; }
  .catcard2:hover { transform:translateY(-3px); box-shadow:0 8px 20px rgba(60,90,150,.14); }
  .crank { position:absolute; top:10px; right:12px; font-size:24px; }
  .crow { display:flex; align-items:center; gap:14px; margin-top:8px; }
  .cavatar { width:64px; height:64px; border-radius:12px; object-fit:cover; background:var(--panel2); }
  .cname { font-size:28px; font-weight:700; }
  .csub { margin-top:2px; }
  .cwr { font-size:34px; font-weight:800; color:var(--c); }
  .cnum { font-size:20px; color:var(--sub); margin-left:8px; }
  .caugs { display:flex; gap:8px; flex-wrap:wrap; margin-top:12px; }
  .caugs .aug-chip { font-size:21px; }
  /* 符文效果悬浮提示 */
  .tt { position:fixed; z-index:100000; max-width:440px; background:rgba(16,22,40,.97); color:#e6ecf8; border:1px solid rgba(120,150,220,.42); border-radius:12px; padding:12px 14px; font-size:22px; line-height:1.5; box-shadow:0 12px 32px rgba(0,0,0,.35); pointer-events:none; }
  .tt b { color:#9cc2ff; font-size:23px; }
  .tt .ttdesc { margin-top:6px; color:#cfd9f0; }
  /* 网页桌宠 */
  .pet { position:fixed; right:22px; bottom:120px; z-index:9999; display:flex; flex-direction:column; align-items:center; cursor:pointer; user-select:none; }
  .petbody { width:180px; height:180px; }
  .petimg { width:180px; height:180px; display:block; object-fit:contain; filter:drop-shadow(0 8px 14px rgba(60,90,150,.28)); }
  .petimg.jump { animation:petJump .5s ease; }
  @keyframes petJump { 0%{transform:translateY(0)} 40%{transform:translateY(-18px)} 100%{transform:translateY(0)} }
  .petbubble { position:absolute; bottom:200px; right:0; width:240px; background:rgba(74,84,110,.86); color:#eef2f8; border:1px solid rgba(150,170,210,.4); border-radius:12px; padding:10px 13px; font-size:21px; line-height:1.45; box-shadow:0 8px 22px rgba(0,0,0,.25); display:none; }
  .petbubble::after { content:''; position:absolute; bottom:-8px; right:30px; border:8px solid transparent; border-top-color:rgba(74,84,110,.86); border-bottom:0; }
  tr.row { cursor:pointer; transition:.15s; }
  tr.row:hover { background:rgba(74,168,255,.08); }
  .champline { display:flex; align-items:center; gap:16px; }
  .avatar { width:60px; height:60px; border-radius:12px; object-fit:cover; background:var(--panel2); }
  .winrate { color:var(--green); font-weight:700; text-shadow:0 1px 2px rgba(20,30,50,.22); }
  .winrate.low { color:var(--red); }
  .pct { color:var(--sub); font-size:24px; }
  .augs { display:flex; gap:8px; flex-wrap:wrap; }
  .augs .aug-chip { background:linear-gradient(160deg,#161d33,#10142a); border:1px solid rgba(100,120,200,.35); color:#dfe6f5; }
  .aug-chip { background:var(--panel2); border:1px solid var(--line); padding:4px 14px; border-radius:14px; font-size:24px; color:var(--txt); display:inline-flex; align-items:center; }
  .aicon { width:36px; height:36px; border-radius:8px; vertical-align:middle; margin-right:8px; }
  /* 无专属图标的符文：预设占位方框（同尺寸、虚线框 + 符文符号），保持卡片一致 */
  .aicon.ph { display:inline-flex; align-items:center; justify-content:center; border:1px dashed rgba(126,148,210,.45); background:rgba(255,255,255,.04); }
  .aicon.ph::after { content:'✦'; color:rgba(170,185,230,.6); font-size:18px; }
  .q { display:inline-block; margin-left:6px; padding:0 9px; font-size:18px; line-height:26px; border-radius:6px; border:1px solid; }
  .q.白银 { color:#4a5470; border-color:#c3ccdd; background:#eef1f7; }
  .q.黄金 { color:#8a6d1a; border-color:#e0ca86; background:#fdf6e0; }
  .q.棱彩 { color:#7a3fa0; border-color:#d7b8ea; background:#f3e8fb; }
  .sechead { display:flex; align-items:center; justify-content:space-between; margin:0 0 14px; font-size:30px; color:var(--gold); }
  .sec { scroll-margin-top:calc(var(--headerh,90px) + 14px); }
  .sec + .sec { margin-top:28px; }
  .secmore { display:flex; justify-content:flex-end; margin-top:16px; }
  /* 板块结尾分隔：柔和发丝线（与面板边框同底色，全宽），更大气 */
  .secend { height:1px; background:rgba(70,90,150,.20); width:100%; margin-top:20px; }
  .sec:last-of-type .secend { display:none; }
  .secnav { display:flex; flex-wrap:wrap; gap:10px; margin:4px 0 18px; }
  .navbtn { display:inline-flex; align-items:center; gap:6px; background:linear-gradient(180deg,#f7f9fc,#edf1f8); border:1px solid var(--line); color:var(--txt); padding:10px 20px; border-radius:10px; cursor:pointer; font-size:23px; font-weight:600; transition:.15s; box-shadow:0 1px 3px rgba(60,90,150,.10); }
  .navbtn::after { content:'›'; font-size:24px; color:var(--sub); transition:transform .15s,color .15s; }
  .navbtn:hover { border-color:var(--blue); color:var(--blue); background:rgba(74,168,255,.10); transform:translateY(-2px); box-shadow:0 5px 14px rgba(74,168,255,.20); }
  .navbtn:hover::after { color:var(--blue); transform:translateX(4px); }
  .navbtn:active { transform:translateY(0) scale(.98); }
  html.dark .navbtn { background:linear-gradient(180deg,#1d2a44,#16203a); border-color:rgba(126,148,210,.40); color:#e8edf8; box-shadow:0 1px 3px rgba(0,0,0,.35); }
  html.dark .navbtn::after { color:#9aa6c8; }
  html.dark .navbtn:hover { border-color:var(--blue); color:#7ec2ff; background:rgba(74,168,255,.18); }
  html.dark .navbtn:hover::after { color:#7ec2ff; }
  .arrow { display:inline-flex; align-items:center; gap:6px; background:rgba(74,168,255,.10); border:1px solid rgba(74,168,255,.36); color:var(--blue); border-radius:10px; padding:6px 16px; cursor:pointer; font-size:23px; font-weight:600; line-height:1.2; transition:.2s; }
  .arrow:hover { background:rgba(74,168,255,.20); border-color:var(--blue); transform:translateY(-1px); box-shadow:0 3px 10px rgba(74,168,255,.18); }
  .arrow:active { transform:translateY(0) scale(.97); }
  .arrow:hover { background:rgba(74,168,255,.15); }
  .detail { background:var(--panel); border:1px solid var(--line); border-radius:18px; padding:24px; box-shadow:0 6px 20px rgba(60,90,150,.10); }
  .dhead { display:flex; align-items:center; gap:20px; margin-bottom:18px; }
  .dhead img { width:96px; height:96px; border-radius:16px; box-shadow:0 4px 18px rgba(74,168,255,.25); }
  .bigwr { font-size:54px; color:var(--gold); font-weight:800; }
  .sec { margin-top:24px; }
  .sec h3 { margin:0 0 14px; font-size:30px; color:var(--gold); }
  .list { display:flex; flex-direction:column; gap:12px; }
  .itemrow { display:flex; justify-content:space-between; align-items:center; gap:14px; padding:14px 18px; background:var(--panel2); border:1px solid var(--line); border-radius:12px; transition:.15s; }
  .itemrow:hover { border-color:rgba(74,168,255,.4); }
  .itemrow .l { display:flex; gap:10px; flex-wrap:wrap; align-items:center; }
  .num { color:#111; font-size:24px; font-weight:700; }
  /* 深色模式：场次/翻页/表头数字统一改浅色，避免黑字看不清 */
  html.dark .num, html.dark #tbl .num, html.dark .pginfo, html.dark .snum, html.dark .cnum { color:#e8edf8; }
  html.dark .pgbtn { color:#e8edf8; background:var(--panel2); border-color:var(--line); }
  html.dark .pgbtn:hover:not(:disabled) { border-color:#e8edf8; }
  .cap { color:var(--sub); font-size:24px; margin:-4px 0 14px; }
  .morebtn { width:100%; margin-top:8px; padding:10px; background:var(--panel2); border:1px dashed var(--line); color:var(--blue); border-radius:12px; cursor:pointer; font-size:24px; }
  .morebtn:hover { background:#e7ecf7; }
  .morewrap { margin-top:6px; display:flex; flex-direction:column; gap:12px; }
  .augwrap { margin-top:6px; }

  .muted { color:var(--sub); }
  .empty { color:var(--sub); padding:24px; text-align:center; }

  .singlecard { flex:1 0 175px; min-width:175px; height:325px; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:8px; padding:18px 12px; background:var(--panel2); border:1px solid var(--line); border-radius:16px; text-align:center; transition:.15s; box-shadow:0 3px 10px rgba(60,90,150,.08); }

  .auggrid { display:grid; grid-template-columns:repeat(6,1fr); gap:12px; }
  .augcard { display:flex; flex-direction:column; align-items:center; gap:8px; padding:18px 12px; background:linear-gradient(160deg,#161d33,#10142a); border:1px solid rgba(100,120,200,.35); border-radius:16px; text-align:center; transition:.15s; height:330px; justify-content:flex-start; box-shadow:0 4px 14px rgba(30,45,95,.25); }
  .augcard:hover { transform:translateY(-2px); }
  .augcard .sname { color:#f2f5fc; }
  .augcard .sdesc { font-size:20px; color:#c3cde6; line-height:1.45; display:-webkit-box; -webkit-line-clamp:4; -webkit-box-orient:vertical; overflow:hidden; }
  @media (max-width:1250px){ .auggrid { grid-template-columns:repeat(4,1fr); } }
  @media (max-width:900px){ .auggrid { grid-template-columns:repeat(3,1fr); } }
  @media (max-width:600px){ .auggrid { grid-template-columns:repeat(2,1fr); } }
  @media (max-width:420px){ .auggrid { grid-template-columns:1fr; } }
  /* 所有符文：品质标题依次吸顶跟随（共享一个贯穿全页的 .qlist 作为包含块），叠放排列 */
  .qhead { position:sticky; top:calc(var(--headerh) + var(--i)*72px); z-index:calc(6 + var(--i)); display:flex; flex-direction:column; align-items:center; justify-content:center; gap:3px; height:72px; cursor:pointer; background:var(--glass); border:1px solid rgba(120,140,200,.28); border-radius:0; transition:.15s; margin-bottom:0; }
  .qhead:hover { border-color:rgba(74,168,255,.4); }
  .qttl { font-size:29px; color:var(--gold); font-weight:700; }
  .qttl .num { font-size:24px; color:var(--sub); }
  .qchev { font-size:23px; color:var(--blue); line-height:1; transition:transform .2s; }
  .qhead.open .qchev { transform:rotate(180deg); }
  .qlist .augwrap { padding:0 4px 14px; }
  .singlecard:hover { border-color:rgba(74,168,255,.4); transform:translateY(-2px); }
  .sicon { width:104px; height:104px; border-radius:16px; object-fit:cover; }
  /* 无专属图标的符文卡：同尺寸预设占位方框，卡片依旧深色渐变 + 等高 */
  .sicon.ph { display:inline-flex; align-items:center; justify-content:center; border:1px dashed rgba(126,148,210,.45); background:rgba(255,255,255,.04); }
  .sicon.ph::after { content:'✦'; color:rgba(170,185,230,.6); font-size:32px; }
  .sname { font-size:28px; font-weight:600; display:flex; align-items:center; gap:5px; flex-wrap:wrap; justify-content:center; }
  .swr { font-size:38px; color:var(--green); font-weight:800; }
  .snum { font-size:24px; color:var(--sub); font-weight:700; }
</style>

async function renderHome(){
  document.body.classList.remove('nobare'); syncHeaderH();
  const champs = await getJSON('/api/champions');
  app.innerHTML = `
    <div class="toolbar" id="homeBar">
      <button class="btn ${sort==='wilson'?'active':''}" onclick="setSort('wilson')">综合胜率</button>
      <button class="btn ${sort==='wr'?'active':''}" onclick="setSort('wr')">纯胜率</button>
      <button class="btn ${sort==='games'?'active':''}" onclick="setSort('games')">场次</button>
      <button class="btn" onclick="toggleAsc()">${ascending?'降序▼':'升序▲'}</button>
      <button class="btn primary" onclick="openAllAugments()">查看所有符文</button>
    </div>
    <table id="tbl">
      <thead><tr><th class="catth"><div class="catdrop"><span class="catlabel">英雄</span><button class="catbtn" title="悬停查看不同定位的英雄分类（刺客/战士/法师/射手/辅助/坦克）"><svg class="cb-ico" width="20" height="20" viewBox="0 0 24 24" fill="none"><path d="M4 6h16M7 12h10M10 18h4" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/></svg>分类 <span class="catv">▾</span></button><div class="catpop">${['刺客','战士','法师','射手','辅助','坦克'].map(c=>{const m=CAT_META[c];return `<div class="catcard" style="--c:${m.color}" onclick="openCategory('${c}')"><span class="ccdot"></span><span class="ccname">${c}</span><span class="ccnum">${CAT_IDS[c].length}</span></div>`;}).join('')}</div></div></th><th>胜率</th><th>场次</th><th>最优符文</th></tr></thead>
      <tbody id="tbody"></tbody>
    </table>
    <div id="pager" class="pager"></div>`;
  window.__champs = champs;
  // 给每个英雄挂上"官方名 + 外号"的可搜索串（外号大小写无关）
  const byName = {};
  for(const nick in NICK){ const real=NICK[nick]; (byName[real]=byName[real]||[]).push(nick); }
  champs.forEach(c=>{ c._search = (c.name + ' ' + (byName[c.name]||[]).join(' ')).toLowerCase(); });
  renderChampsList();
  petHello();
}

function renderChampsList(){
  const q = (document.getElementById('q').value||'').trim().toLowerCase();
  let list = window.__champs;
  if(q) list = list.filter(c => c._search.includes(q));
  list = list.slice().sort((a,b)=>{
    let va=a[sort]||0, vb=b[sort]||0;
    return ascending ? va-vb : vb-va;
  });
  const tb = document.getElementById('tbody');
  const total = list.length;
  const pages = Math.max(1, Math.ceil(total/per));
  if(page > pages) page = pages;
  if(page < 1) page = 1;
  const cur = list.slice((page-1)*per, (page-1)*per+per);
  tb.innerHTML = cur.map(c=>`
    <tr class="row" onclick="openChamp('${c.id}')">
      <td><div class="champline">${avimg(c.image,c.name,'avatar')}<span>${c.name}</span></div></td>
      <td><span class="winrate ${c.wr<0.45?'low':''}">${(c.wr*100).toFixed(1)}%</span></td>
      <td class="num">${c.games}</td>
      <td><div class="augs">${(c.best3||[]).map(b=>augChip(b.name,b.quality,b.icon)).join('')}</div></td>
    </tr>`).join('');
  renderPager(total, pages);
}
function renderPager(total, pages){
  const el = document.getElementById('pager');
  if(!el) return;
  if(total <= 0 || pages <= 1){ el.innerHTML = ''; return; }
  el.innerHTML = `<button class="pgbtn" ${page<=1?'disabled':''} onclick="setPage(${page-1})">‹</button><span class="pginfo">第 ${page} / ${pages} 页 · 共 ${total} 个英雄</span><button class="pgbtn" ${page>=pages?'disabled':''} onclick="setPage(${page+1})">›</button>`;
}
function setPage(p){ page = p; renderChampsList(); }
function resetAndRender(){ page = 1; renderChampsList(); }

async function openChamp(id){
  const d = await getJSON('/api/champion/'+id);
  const hasAug = d.augments_by_quality&&d.augments_by_quality.length;
  const combos = d.combos||[], synergy = d.synergy||[], builds = d.builds||[], counters = d.counters||[];
  const nav = [];
  if(hasAug) nav.push(`<button class="navbtn" onclick="jumpTo('sec-augments')">最优单个符文</button>`);
  if(combos.length) nav.push(`<button class="navbtn" onclick="jumpTo('sec-combos')">最优符文组合</button>`);
  if(synergy.length) nav.push(`<button class="navbtn" onclick="jumpTo('sec-synergy')">搭配增益</button>`);
  if(builds.length) nav.push(`<button class="navbtn" onclick="jumpTo('sec-builds')">核心出装</button>`);
  if(counters.length) nav.push(`<button class="navbtn" onclick="jumpTo('sec-counters')">克制推荐</button>`);
  const navHtml = nav.length?`<div class="secnav">${nav.join('')}</div>`:'';
  app.innerHTML = `
    <div class="toolbar"><button class="btn" onclick="renderHome()">返回</button></div>
    <div class="detail">
      <div class="dhead">
        ${avimg(d.image,d.name,'')}
        <div>
          <h2 style="margin:0">${d.name}</h2>
          <div class="sub">整体胜率 <span class="bigwr">${(d.overall.wr*100).toFixed(1)}%</span> · ${d.overall.games} 场</div>
        </div>
      </div>
      ${navHtml}
      ${hasAug?`<div class="sec" id="sec-augments"><h3 class="sechead"><span>最优单个符文</span></h3><div class="cap">该英雄带这个符文胜率最高（按品质分档）</div>${qualityBlocks(d,false)}${(d.augments_by_quality.some(g=>g.items.length>5))?`<div class="secmore"><button class="arrow" onclick="openSection('${id}','augments')">更多 ›</button></div>`:''}<div class="secend"></div></div>`:''}
      ${sec('最优符文组合', combos.map(comboRow), '这几个符文一起带的胜率', id, 'combos', 6, 'sec-combos')}
      ${sec('搭配增益', synergy.map(synergyRow), '这两个符文一起带，胜率比该英雄平均▲高/▼低', id, 'synergy', 6, 'sec-synergy')}
      ${sec('核心出装', builds.map(buildRow), '该英雄这流派常见的核心三件套', id, 'builds', 6, 'sec-builds')}
      ${sec('克制推荐', counters.map(counterRow), '敌方是这类阵容时，选这个符文克制（▲ 克制加成 / ▼ 反被压制）', id, 'counters', 6, 'sec-counters')}
    </div>`;
  window.scrollTo(0,0);
}

const augCache = {};
async function augName(x){ if(augCache[x]) return augCache[x]; if(!window.__augmap){ window.__augmap={}; (await getJSON('/api/augments_global')).forEach(a=>window.__augmap[a.id]=a.name);} return window.__augmap[x]||('符文'+x); }

function sec(title, rows, caption, cid, key, limit, sid){
  if(!rows||!rows.length) return '';
  limit = limit || 6;
  const first = rows.slice(0, limit);
  const more = rows.length > limit ? `<div class="secmore"><button class="arrow" onclick="openSection('${cid}','${key}')">更多 ›</button></div>` : '';
  return `<div class="sec" id="${sid||''}"><h3 class="sechead"><span>${title}</span></h3>${caption?`<div class="cap">${caption}</div>`:''}<div class="list">${first.join('')}</div>${more}<div class="secend"></div></div>`;
}
function jumpTo(id){ const el=document.getElementById(id); if(el) el.scrollIntoView({behavior:'smooth', block:'start'}); }
function singleRow(a){ return `<div class="singlecard hasicon" data-name="${a.name}">${a.icon?`<img class="sicon" src="${a.icon}" onerror="this.style.display='none'">`:`<span class="sicon ph"></span>`}<div class="sname">${a.name}${a.quality?`<span class="q ${a.quality}">${a.quality}</span>`:''}</div><div class="swr">${(a.wr*100).toFixed(1)}%</div><div class="snum">${a.games}场</div></div>`; }
function comboRow(c){ return `<div class="itemrow"><div class="l">${(c.augment_meta||[]).map(m=>augChip(m.name,m.quality,m.icon)).join('')} <span class="num">${c.games}场</span></div><span class="winrate">${(c.wr*100).toFixed(1)}%</span></div>`; }
function synergyRow(s){ return `<div class="itemrow"><div class="l">${augChip(s.aname,s.aquality,s.aicon)}+${augChip(s.bname,s.bquality,s.bicon)} <span class="num">${s.games}场</span></div><div class="r"><span class="winrate">${(s.wr*100).toFixed(1)}%</span> <span class="pct">${s.lift>0?'▲':'▼'}${Math.abs(s.lift*100).toFixed(1)}%</span></div></div>`; }
function itemCard(name, icon){ return `<span class="aug-chip hasicon">${icon?`<img class="aicon" src="${icon}" onerror="this.style.display='none'">`:`<span class="aicon ph"></span>`}${name}</span>`; }

async function openAllAugments(){

  let total = 0;
  const blocks = [];

  order.forEach(q=>{

    if(!g || !g.items.length) return;
    total += g.items.length;
    const pid = 'rq'+Math.random().toString(36).slice(2,7);
    blocks.push(`<div class="qhead" id="h-${pid}" style="--i:${qi}" onclick="toggleQual('${pid}')"><span class="qttl">${q} <span class="num">${g.items.length}个</span></span><span class="qchev">▼</span></div>`);
    qi++;
    blocks.push(`<div class="augwrap" id="a-${pid}" style="display:none"><div class="auggrid">${g.items.map(augCard).join('')}</div></div>`);
  });

}

function esc(s){ return String(s).replace(/[&<>"]/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }
let ttTimer;
function showTT(el){ clearTimeout(ttTimer); const name=el.getAttribute('data-name')||''; const d=(__augdesc&&__augdesc[name])||''; ttEl.innerHTML=`<b>${esc(name)}</b>${d?`<div class="ttdesc">${esc(d)}</div>`:''}`; ttEl.style.display='block'; }
function hideTT(){ clearTimeout(ttTimer); ttTimer=setTimeout(()=>{ ttEl.style.display='none'; },120); }
function moveTT(e){ if(ttEl.style.display==='none') return; const pad=12; let x=e.clientX+16, y=e.clientY+16; const r=ttEl.getBoundingClientRect(); if(x+r.width>innerWidth-pad) x=e.clientX-r.width-16; if(y+r.height>innerHeight-pad) y=e.clientY-r.height-12; ttEl.style.left=x+'px'; ttEl.style.top=y+'px'; }

profEl.innerHTML = `<div class="profile-card">
  <button class="lclose" onclick="closeProfile()">✕</button>
  <div class="pf-av"><img id="pfAv" alt="头像"><label class="pf-up" for="pfFile">更换头像</label><input id="pfFile" type="file" accept="image/*" hidden onchange="onAvatarChange(event)"></div>
  <div class="pf-name" id="pfName"></div>
  <div class="pf-contact" id="pfContact"></div>
  <div class="pf-admin" id="pfAdmin" style="display:none">管理员</div>
  <button class="pf-logout" onclick="logout()">退出登录</button>
</div>`;
function openProfile(){ if(!AUTH) return; const u=AUTH.user; document.getElementById('pfAv').src=_Avatar(u); document.getElementById('pfName').textContent=u.name; document.getElementById('pfContact').textContent=u.contact; document.getElementById('pfAdmin').style.display=u.is_admin?'inline-block':'none'; profEl.style.display='flex'; }
function closeProfile(){ profEl.style.display='none'; }
function onAvatarChange(e){ const f=e.target.files[0]; if(!f) return; const rd=new FileReader(); rd.onload=async function(){ const r=await apiAuth('avatar', {avatar:rd.result}); if(r.ok){ AUTH.user.avatar=r.avatar; saveAuth(AUTH); openProfile(); } else { alert(r.error||'上传失败'); } }; rd.readAsDataURL(f); }
async function logout(){ await apiAuth('logout', {}); saveAuth(null); closeProfile(); try{ localStorage.removeItem('dsh_prefs_guest'); }catch(e){} document.documentElement.classList.remove('dark'); document.body.style.background=''; if(window.__petLock) delete window.__petLock; }
window.openLogin = openLogin; window.closeLogin = closeLogin; window.closeProfile = closeProfile; window.showForgot = showForgot; window.forgotSend = forgotSend; window.doReset = doReset;

// —— 个人中心（登录权益：背景/桌宠锁定/主题/评论）——
function prefsKey(){ return 'dsh_prefs_' + (AUTH && AUTH.user ? AUTH.user.id : 'guest'); }
function loadPrefs(){ try{ return JSON.parse(localStorage.getItem(prefsKey())) || {}; }catch(e){ return {}; } }
function savePrefs(p){ localStorage.setItem(prefsKey(), JSON.stringify(p)); if(AUTH && AUTH.token){ apiAuth('prefs', p); } }
async function loadServerPrefs(){ if(!AUTH || !AUTH.token) return; try{ const r=await apiAuth('prefs'); if(r.ok && r.prefs){ localStorage.setItem(prefsKey(), JSON.stringify(r.prefs)); applyPrefs(); } }catch(e){} }
function applyPrefs(){
  const p = loadPrefs();
  const dark = p.theme === 'dark';
  document.documentElement.classList.toggle('dark', dark);
  const set = dark ? DARK_PRESETS : BG_PRESETS;
  const matched = p.bg && set.some(x=>x.css===p.bg);
  if(dark){
    // 深色模式：应用深色预设；否则用深色默认背景
    document.body.style.background = matched ? p.bg : '';
  } else {
    if(matched){ document.body.style.background = p.bg; }
    else { document.body.style.background=''; }
  }
  const newLock = (AUTH && Array.isArray(p.pets) && p.pets.length) ? p.pets.slice() : null;
  const lockChanged = newLock && JSON.stringify(newLock) !== JSON.stringify(window.__petLock);
  window.__petLock = newLock;
  // 登录后 / 锁定列表变化：让桌宠立即变成选中列表中的一个
  if(lockChanged){ try{ petHello(); }catch(e){} }
  const amt = document.getElementById('amTheme'); if(amt) amt.textContent = p.theme==='dark'?'深色':'浅色';
}
function setBg(css){ const p=loadPrefs(); p.bg=css; p.bgImg=''; savePrefs(p); applyPrefs(); openPersonalCenter(); }
function clearBg(){ const p=loadPrefs(); p.bgImg=''; p.bg=''; savePrefs(p); applyPrefs(); openPersonalCenter(); }
let toastEl; function toast(msg){ if(!toastEl){ toastEl=document.createElement('div'); toastEl.className='toast'; document.body.appendChild(toastEl); } toastEl.textContent=msg; toastEl.classList.add('show'); clearTimeout(toastEl._t); toastEl._t=setTimeout(()=>toastEl.classList.remove('show'), 1800); }
let pcSel = [];
function togglePet(file){ pcSel = pcSel.includes(file) ? pcSel.filter(x=>x!==file) : pcSel.concat([file]); const el=document.getElementById('pcPetsGrid'); if(el) el.innerHTML=renderPetGrid(); }
function renderPetGrid(){ return PET_IMGS.map(x=>`<div class="pc-pet ${pcSel.includes(x[0])?'on':''}" onclick="togglePet('${x[0]}')"><img src="/static/${x[0]}" alt="${x[1]}"><span>${x[1]}</span></div>`).join(''); }
function confirmPets(){ const p=loadPrefs(); p.pets=pcSel.slice(); savePrefs(p); applyPrefs(); openPersonalCenter(); }
let pcTheme = 'light';
function pickTheme(t){ pcTheme = t; const sec=document.querySelector('.pc-themes'); if(sec) sec.querySelectorAll('.pc-theme').forEach(b=>b.classList.toggle('on', b.getAttribute('data-theme')===t)); }
function confirmTheme(){ const p=loadPrefs(); p.theme=pcTheme; savePrefs(p); applyPrefs(); toast('主题已切换'); openPersonalCenter(); }
function addComment(){ const inp=document.getElementById('pcComment'); const t=(inp.value||'').trim(); if(!t) return; const p=loadPrefs(); p.comments=p.comments||[]; p.comments.push({text:t, ts:new Date().toLocaleString()}); savePrefs(p); inp.value=''; renderComments(); }
function renderComments(){ const el=document.getElementById('pcClist'); if(!el) return; const list=(loadPrefs().comments||[]); el.innerHTML = list.length? list.map(c=>`<div class="pc-comment"><div class="pc-ctext">${c.text}</div><div class="pc-ctime">${c.ts}</div></div>`).join('') : '<div class="empty">还没有评论，来发第一条吧</div>'; }
function openPersonalCenter(){
  if(!AUTH){ alert('请先登录'); return; }
  document.body.classList.add('nobare');
  const p = loadPrefs();
  pcSel = (p.pets||[]).slice();
  pcTheme = p.theme || 'light';
  const dk = (p.theme==='dark' ? 'darkpre' : '');
  const curBgs = (p.theme==='dark' ? DARK_PRESETS : BG_PRESETS);
  const bgs = curBgs.map(b=>`<div class="pc-bg ${dk} ${(p.bg||'')===b.css?'on':''}" style="${b.css?('background:'+b.css):('background:'+(p.theme==='dark'?'#0a0e18':'var(--panel2)'))}" onclick="setBg('${b.css}')"><span>${b.name}</span></div>`).join('');
  app.innerHTML = `
    <div class="detail">
      <div class="pc-head"><button class="btn" onclick="renderHome()">返回</button><h2 style="margin:0">个人中心</h2><span class="pc-hello">${AUTH.user.name}（${AUTH.user.is_admin?'管理员':'普通用户'}）</span></div>
      <div class="pc-sec"><h3>我的账号</h3><div class="pc-acc"><img id="pcAv" class="pc-av" src="${_Avatar(AUTH.user)}" title="点击更换头像" onclick="document.getElementById('pcFile').click()" onerror="this.onerror=null;this.src='/static/preset_avatar.png'"><div class="pc-accinfo"><div class="pc-accname">${AUTH.user.name}</div><div class="pc-accsub">${AUTH.user.contact}${AUTH.user.phone?'　·　手机 '+AUTH.user.phone:''}</div></div><div class="pc-accbtns"><button class="pc-btn" onclick="document.getElementById('pcFile').click()">更换头像</button><button class="pc-btn" onclick="showPwdForm()">更改密码</button><button class="pc-btn" onclick="showPhoneForm()">${AUTH.user.phone?'修改手机号':'绑定手机号'}</button><button class="pc-btn" onclick="showNameForm()">更改用户名</button><button class="pc-btn danger" onclick="logout()">退出登录</button></div><input id="pcFile" type="file" accept="image/*" hidden onchange="onAvatarE(event)"></div><div id="pcForm" class="pc-formwrap"></div></div>
      <div class="pc-sec"><h3>自定义网页背景</h3><div class="pc-bgs">${bgs}</div><div class="pc-okrow"><button class="pc-btn" onclick="clearBg()">恢复默认</button></div></div>
      <div class="pc-sec"><h3>锁定 Q 版人物形象</h3><div class="pc-pets" id="pcPetsGrid">${renderPetGrid()}</div><div class="pc-okrow"><button class="pc-btn ok" onclick="confirmPets()">确定</button><span class="pc-okhint">点击选中/取消 · 可多选，确定后锁定</span></div></div>
      <div class="pc-sec"><h3>改变网站风格</h3><div class="pc-themes"><button class="pc-theme ${pcTheme!=='dark'?'on':''}" data-theme="light" onclick="pickTheme('light')">浅色</button><button class="pc-theme ${pcTheme==='dark'?'on':''}" data-theme="dark" onclick="pickTheme('dark')">深色</button></div><div class="pc-okrow"><button class="pc-btn ok" onclick="confirmTheme()">确定</button></div></div>
    </div>`;
  renderComments();
  window.scrollTo(0,0);
}
function onAvatarE(e){ const f=e.target.files[0]; if(!f) return; const rd=new FileReader(); rd.onload=function(){ document.getElementById('pcForm').innerHTML = `<div class="pc-form"><div class="pc-form-t">预览头像</div><img class="pc-prev" src="${rd.result}"><div class="pc-form-btns"><button class="pc-btn ok" onclick="uploadAvatar('${rd.result}')">确认上传</button><button class="pc-btn" onclick="clearForm()">取消</button></div></div>`; }; rd.readAsDataURL(f); }
async function uploadAvatar(dataUrl){ const r=await apiAuth('avatar',{avatar:dataUrl}); if(r.ok){ AUTH.user.avatar=r.avatar; saveAuth(AUTH); clearForm(); toast('头像已更新'); openPersonalCenter(); } else alert(r.error||'上传失败'); }
function showPwdForm(){ document.getElementById('pcForm').innerHTML = `<div class="pc-form"><div class="pc-form-t">修改密码</div><input id="pfNew" class="pc-form-in" type="password" placeholder="新密码（至少4位）"><input id="pfNew2" class="pc-form-in" type="password" placeholder="确认新密码"><div class="pc-form-btns"><button class="pc-btn ok" onclick="savePwd()">保存</button><button class="pc-btn" onclick="clearForm()">取消</button></div></div>`; }
async function savePwd(){ const a=document.getElementById('pfNew').value, b=document.getElementById('pfNew2').value; if(a.length<4){ alert('密码至少4位'); return; } if(a!==b){ alert('两次密码不一致'); return; } const r=await apiAuth('password',{password:a}); if(r.ok){ clearForm(); toast('密码已修改'); } else { alert(r.error||'修改失败'); } }
function showNameForm(){ document.getElementById('pcForm').innerHTML = `<div class="pc-form"><div class="pc-form-t">修改用户名</div><input id="pname" class="pc-form-in" placeholder="新的用户名" value="${AUTH.user.name}"><div class="pc-form-btns"><button class="pc-btn ok" onclick="saveName()">保存</button><button class="pc-btn" onclick="clearForm()">取消</button></div></div>`; }
async function saveName(){ const n=document.getElementById('pname').value.trim(); if(!n){ alert('请输入用户名'); return; } const r=await apiAuth('name',{name:n}); if(r.ok){ AUTH.user.name=r.name; saveAuth(AUTH); clearForm(); toast('用户名已更新'); openPersonalCenter(); } else { alert(r.error||'修改失败'); } }
function showPhoneForm(){ document.getElementById('pcForm').innerHTML = `<div class="pc-form"><div class="pc-form-t">${AUTH.user.phone?'修改手机号':'绑定手机号'}</div><div class="pc-form-tip">绑定后可用该手机号登录（一个手机号只能绑定一个账号）</div><input id="pphone" class="pc-form-in" placeholder="输入11位手机号" value="${AUTH.user.phone||''}"><div class="pc-form-btns"><button class="pc-btn ok" onclick="savePhone()">${AUTH.user.phone?'保存修改':'确认绑定'}</button>${AUTH.user.phone?'<button class="pc-btn danger" onclick="unbindPhone()">解绑</button>':''}<button class="pc-btn" onclick="clearForm()">取消</button></div></div>`; }
async function savePhone(){ const p=document.getElementById('pphone').value.trim(); if(!/^1[3-9]\d{9}$/.test(p)){ alert('请输入正确的手机号（1开头11位）'); return; } const r=await apiAuth('phone',{phone:p}); if(r.ok){ AUTH.user.phone=r.phone; saveAuth(AUTH); clearForm(); toast('手机号已绑定'); openPersonalCenter(); } else { alert(r.error||'绑定失败'); } }
async function unbindPhone(){ if(!confirm('确定解绑当前手机号？')) return; const r=await apiAuth('phone',{phone:''}); if(r.ok){ AUTH.user.phone=''; saveAuth(AUTH); clearForm(); toast('已解绑手机号'); openPersonalCenter(); } else { alert(r.error||'解绑失败'); } }
function clearForm(){ document.getElementById('pcForm').innerHTML=''; }
window.openPersonalCenter = openPersonalCenter; window.showPhoneForm = showPhoneForm; window.savePhone = savePhone; window.unbindPhone = unbindPhone;

// —— 管理员后台 ——
async function adminApi(path, body, method){ const r = await fetch('/api/admin/'+path, {method: method||(body?'POST':'GET'), headers:{'Content-Type':'application/json', Authorization:'Bearer '+(AUTH&&AUTH.token)}, body: body?JSON.stringify(body):undefined}); return r.json(); }
function adminActions(u){
  const me = AUTH.user;
  const self = u.contact === me.contact;
  const owner = !!me.owner; // 当前操作者是否主管理员
  if(self) return '<span style="color:var(--sub);font-size:20px;">当前账号</span>';
  let b = '';
  if(owner){ // 主管理员：完全控制
    b += u.is_admin ? `<button class="pc-btn" onclick="adminRole('${u.id}',0)">降为普通</button>` : `<button class="pc-btn" onclick="adminRole('${u.id}',1)">设为管理员</button>`;
    b += ` <button class="pc-btn" onclick="adminPwd('${u.id}')">重置密码</button>`;
    b += ` <button class="pc-btn danger" onclick="adminDel('${u.id}')">删除</button>`;
  } else { // 普通管理员：只能管普通用户
    b += u.is_admin ? '<span style="color:var(--sub);font-size:20px;">仅主管理员可操作</span>'
                    : `<button class="pc-btn" onclick="adminPwd('${u.id}')">重置密码</button> <button class="pc-btn danger" onclick="adminDel('${u.id}')">删除</button>`;
  }
  return b;
}
function openAdmin(){ if(!AUTH || !AUTH.user.is_admin){ alert('需要管理员权限'); return; } renderAdmin(); }
async function renderAdmin(){
  const d = await adminApi('users');
  const list = d.users || [];
  app.innerHTML = `<div class="toolbar"><button class="btn" onclick="renderHome()">返回</button><h2 style="margin:0">管理后台</h2><span class="pc-hello">共 ${list.length} 位用户</span></div>
    <div class="detail">
      <h3 class="sechead"><span>用户管理</span></h3>
      <table id="tbl"><thead><tr><th>用户</th><th>账号</th><th>角色</th><th>注册时间</th><th>操作</th></tr></thead><tbody>
        ${list.map(u=>`<tr><td><div class="champline">${u.avatar?`<img class="avatar" src="${u.avatar}" onerror="this.style.visibility='hidden'">`:''}<span>${u.name||'—'}</span></div></td><td>${u.contact}</td><td>${u.owner?'<span class="q 黄金">主管理员</span>':(u.is_admin?'<span class="q 黄金">管理员</span>':'<span class="q 白银">普通</span>')}</td><td>${new Date((u.created||0)*1000).toLocaleDateString()}</td><td>${adminActions(u)}</td></tr>`).join('')}
      </tbody></table>
    </div>`;
  window.scrollTo(0,0);
}
async function adminRole(id, val){ const r=await adminApi('user/'+id, {is_admin:!!val}); if(r.ok){ toast('已更新角色'); renderAdmin(); } else alert(r.error||'操作失败'); }
async function adminPwd(id){ const pw=prompt('输入新密码（至少4位）'); if(!pw) return; const r=await adminApi('user/'+id, {password:pw}); if(r.ok) toast('已重置密码'); else alert(r.error||'操作失败'); }
async function adminDel(id){ if(!confirm('确定删除该用户？')) return; const r=await adminApi('delete/'+id, {}); if(r.ok){ toast('已删除'); renderAdmin(); } else alert(r.error||'操作失败'); }
window.openAdmin = openAdmin;

renderHome();
</script>
</body>
</html>
